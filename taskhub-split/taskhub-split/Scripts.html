  function markTaskHubFirstContent_(view) {
    if (firstContentMarkedViews.has(view)) return;
    firstContentMarkedViews.add(view);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.dataset.taskhubFirstContentView = view;
      document.body.dataset.taskhubFirstContentAt = String(Date.now());
      if (typeof performance !== 'undefined') {
        performance.mark('taskhub-first-content-' + view);
        console.info('TASKHUB_BROWSER_FIRST_CONTENT', {view, frameMs: performance.now()});
      }
    }));
  }
