<script>
  const AUTO_REFRESH_INTERVAL = 15 * 60 * 1000;
  const NOTIFIED_IDS_KEY = 'notifiedAssignmentMessageIds';
  const GROUP_OPEN_STATE_KEY = 'notificationGroupOpenState';
  const HELP_SEEN_KEY = 'assignmentHubHelpSeen';

  let lastUndoMessageId = '';
  let undoToastTimerId = null;
  const notificationData = {active: [], completed: []};
  const notificationDataLoaded = {active: false, completed: false};
  const notificationRequestIds = {active: 0, completed: 0};
  const notificationRequestsInFlight = {active: null, completed: null};
  const notificationStatusChanges = new Map();
  let notificationStatusGeneration = 0;
  let currentViewMode = 'active';
  let currentRawData = [];
  let homeRawData = [];
  let homeFirstPaintSummary = null;
  let clientViewDataGeneration = 0;
  let homeViewPrefetchScheduled = false;
  let notificationStartupSnapshotReusable = false;
  const firstContentMarkedViews = new Set();
  let selectedCourseName = 'すべて';
  let currentScreen = 'home';
  let expandedHomeDueGroup = null;
  let groupOpenState;
  let securityTokenVisible = false;
  let notificationSyncInFlight = false;
  let notificationSyncToastTimerId = null;
  let testCaseModeEnabled = false;
  let testCaseClockDateTime = '';
  let testCaseClockPresets = [];

  function markTaskHubFirstContent_(view) {
    const isVisibleView = () => view === 'assignment'
      ? currentScreen === 'active' || currentScreen === 'completed'
      : currentScreen === view;
    if (!isVisibleView()) return;
    if (firstContentMarkedViews.has(view)) return;
    firstContentMarkedViews.add(view);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (!isVisibleView()) {firstContentMarkedViews.delete(view); return;}
      document.body.dataset.taskhubFirstContentView = view;
      document.body.dataset.taskhubFirstContentAt = String(Date.now());
      if (typeof performance !== 'undefined') {
        performance.mark('taskhub-first-content-' + view);
        console.info('TASKHUB_BROWSER_FIRST_CONTENT', {view, frameMs: performance.now()});
      }
    }));
  }

  function markTaskHubAllListsReady_() {
    if (!notificationDataLoaded.active || !universityState.loaded || universityState.partial ||
        document.body.dataset.taskhubAllListsReadyAt) return;
    const generation = clientViewDataGeneration;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (generation !== clientViewDataGeneration || !notificationDataLoaded.active ||
          !universityState.loaded || universityState.partial) return;
      document.body.dataset.taskhubAllListsReadyAt = String(Date.now());
      document.body.dataset.taskhubAllTasksCount = String(notificationData.active.length);
      document.body.dataset.taskhubAllNoticesCount = String(universityState.items.length);
    }));
  }
</script>
