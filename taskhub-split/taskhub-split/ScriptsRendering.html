<script>
  function renderNotifications(data, viewMode = 'active') {
  const list = document.getElementById('list');

  if (!data || data.length === 0) {
    list.textContent = viewMode === 'completed'
      ? '完了済みの通知はまだありません。'
      : '通知はまだありません。';
    return;
  }

  const fragment = document.createDocumentFragment();

  // Sync already assigned every task a due group and sorted these rows. The
  // browser only walks that order and emits a heading when the stored key
  // changes; it does not inspect dates, regroup rows, or sort cards.
  let cardIndex = 0;
  let currentGroupKey = '';
  let groupBody = null;
  data.forEach(item => {
    const key = getPreparedTaskGroupKey(item, viewMode);
    if (key !== currentGroupKey) {
      currentGroupKey = key;
      const group = getPreparedTaskGroupInfo(key, viewMode);
      const groupOpen = isGroupOpen(viewMode, key);
      const groupButtonId = `group-button-${viewMode}-${key}`;
      const groupBodyId = `group-body-${viewMode}-${key}`;
      const groupArrowId = `group-arrow-${viewMode}-${key}`;
      const groupTitle = document.createElement('button');
      groupTitle.type = 'button';
      groupTitle.id = groupButtonId;
      groupTitle.className = groupOpen ? 'group-title is-open' : 'group-title is-closed';
      groupTitle.setAttribute('aria-expanded', String(groupOpen));
      groupTitle.setAttribute('aria-controls', groupBodyId);
      groupTitle.onclick = () => toggleGroup(viewMode, key);
      groupTitle.innerHTML = `
        <span class="group-label">${escapeHtml(group.label)}</span>
        <span class="group-meta">
          <span class="group-count">${Number(item.displayDueGroupCount || 0)}件</span>
          <span class="group-arrow" id="${groupArrowId}">${groupOpen ? '⌃' : '⌄'}</span>
        </span>
      `;
      fragment.appendChild(groupTitle);

      groupBody = document.createElement('div');
      groupBody.id = groupBodyId;
      groupBody.className = 'group-body';
      groupBody.style.display = groupOpen ? '' : 'none';
      fragment.appendChild(groupBody);
    }

    const card = document.createElement('div');
    card.className = `card ${getCardClassByGroupKey(currentGroupKey)}`;
    const currentIndex = cardIndex++;
    const detailMessageId = encodeURIComponent(String(item.messageId || '')).replaceAll("'", '%27');
    const cardCourseLabel = getAssignmentCardCourseLabel(item);
    card.innerHTML = `
      <div class="card-topline">
        <div class="card-course" title="${escapeAttribute(cardCourseLabel)}">${escapeHtml(cardCourseLabel)}</div>
      </div>
      <div class="card-title-line">
        <div class="title">${escapeHtml(item.title || 'タイトル未抽出')}</div>
        <div class="card-due ${getDueTextClassByGroupKey(currentGroupKey)}">期限：${escapeHtml(item.dueDate || '未検出')}</div>
      </div>
      <div class="button-row">
        ${getClassroomOpenButtonHtml(item)}
        ${item.firstPaintOnly ? '<button class="card-action card-details" type="button" disabled>詳細を読み込み中</button>' : `<button class="card-action card-details" type="button" onclick="toggleBody(${currentIndex}, '${detailMessageId}')">詳細</button>`}
        ${getStatusActionButtonHtml(item, viewMode)}
      </div>
      <div class="body" id="body-${currentIndex}">${escapeHtml(item.body || '')}</div>
    `;
    groupBody.appendChild(card);
  });

  list.replaceChildren(fragment);
  markTaskHubFirstContent_('assignment');
  if (!cardIndex) list.textContent = '表示対象の通知はありません。';
}

function getPreparedTaskGroupKey(item, viewMode) {
  if (viewMode === 'completed') return 'completed';
  const key = String(item && item.displayDueGroupKey || 'unknown');
  return ['expired', 'today', 'tomorrow', 'thisWeek', 'later', 'none', 'unknown'].includes(key)
    ? key
    : 'unknown';
}

function getPreparedTaskGroupInfo(key, viewMode) {
  if (viewMode === 'completed') return {label: '完了済み'};
  const labels = {
    expired: '期限切れ', today: '今日まで', tomorrow: '明日まで',
    thisWeek: '今週中', later: '来週以降', none: '期限なし', unknown: '期限未検出'
  };
  return {label: labels[key] || labels.unknown};
}

function getAssignmentCardCourseLabel(item) {
  const source = String(item && item.source || '').trim();
  const sourceLabel = source === 'Google Classroom' ? 'Classroom' : source;
  const course = String(item && item.courseName || '授業名未抽出').trim();
  const period = String(item && item.weekdayPeriod || '').trim().replace(/^\[|\]$/g, '');
  const courseLabel = period && !course.includes(period) ? `${course} [${period}]` : course;
  return [sourceLabel, courseLabel].filter(Boolean).join(' / ') || '授業名未抽出';
}

function getDueTextClassByGroupKey(key) {
  if (key === 'expired') return 'is-due-expired';
  if (key === 'today') return 'is-due-today';
  if (key === 'tomorrow') return 'is-due-tomorrow';
  return 'is-due-neutral';
}

  function getClassroomOpenButtonHtml(item) {
    const url = item && item.classroomUrl ? String(item.classroomUrl).trim() : '';

    if (!isSafeHttpUrl(url)) {
      return '';
    }

    return `<a class="button classroom-button" href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">課題を開く</a>`;
  }

  function isSafeHttpUrl(url) {
    try {
      const parsedUrl = new URL(String(url || ''), window.location.href);
      return parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:';
    } catch (e) {
      return false;
    }
  }

  function getDisplayDueStatus(dueStatus) {
    if (dueStatus === '抽出成功') {
      return '期限抽出成功';
    }

    return dueStatus || '';
  }

  function getDisplayStatus(status) {
    if (status === '未確認') {
      return '未完了';
    }

    return status || '';
  }

  function getStatusActionButtonHtml(item, viewMode) {
    const encodedMessageId = encodeURIComponent(item.messageId || '');

    if (!encodedMessageId) {
      return '';
    }

    if (viewMode === 'completed') {
      return `<button class="card-action card-complete is-completed" type="button" aria-label="クリックして未完了に戻す" title="クリックして未完了に戻す" onclick="markAsUndone('${encodedMessageId}')">✓ 完了</button>`;
    }

    return `<button class="card-action card-complete" type="button" aria-label="完了にする" onclick="markAsDone('${encodedMessageId}')">完了</button>`;
  }

  function getCardClassByGroupKey(key) {
    if (key === 'expired') {
      return 'is-expired';
    }

    if (key === 'today') {
      return 'is-urgent';
    }

    if (key === 'tomorrow') {
      return 'is-soon';
    }

    if (key === 'thisWeek' || key === 'later') {
      return 'is-later';
    }

    if (key === 'completed') {
      return 'is-completed';
    }

    if (key === 'none') {
      return 'is-none';
    }

    if (key === 'unknown') {
      return 'is-unknown';
    }

    return '';
  }
</script>
