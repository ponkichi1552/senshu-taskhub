<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8FFF4"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F3340" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #F6FAFB; }
      .ink { fill: #102026; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .muted { fill: #74848A; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .white-card { fill: #FFFFFF; stroke: #DCE8EA; stroke-width: 1.3; filter: url(#shadow); }
      .soft-card { fill: #EFFBF8; stroke: #BFEFE6; stroke-width: 1.5; }
      .line { stroke: #E3ECEE; stroke-width: 1.4; }
      .accent { fill: #18A999; }
      .blue { fill: #4D8DFF; }
      .warn { fill: #FF8A5B; }
    </style>
  </defs>

  <rect width="430" height="932" rx="0" class="bg"/>

  <rect x="0" y="0" width="430" height="182" fill="url(#hero)"/>
  <circle cx="363" cy="52" r="24" fill="#FFFFFF" opacity="0.72"/>
  <circle cx="304" cy="52" r="24" fill="#FFFFFF" opacity="0.72"/>
  <text x="304" y="62" text-anchor="middle" class="ink" font-size="27">?</text>
  <text x="363" y="62" text-anchor="middle" class="ink" font-size="24">⚙</text>

  <text x="28" y="62" class="ink" font-size="28" font-weight="800">課題通知Hub</text>
  <text x="30" y="91" class="muted" font-size="13" font-weight="600">今日やることを、先に見る。</text>
  <rect x="28" y="118" width="154" height="34" rx="17" fill="#FFFFFF" opacity="0.88"/>
  <circle cx="48" cy="135" r="7" class="accent"/>
  <text x="64" y="140" class="ink" font-size="13" font-weight="700">同期済み 14:12</text>

  <g transform="translate(28 210)">
    <text x="0" y="0" class="ink" font-size="23" font-weight="800">課題一覧</text>
    <rect x="0" y="24" width="374" height="198" rx="24" class="white-card"/>

    <rect x="18" y="44" width="338" height="54" rx="17" fill="#FFF4EC"/>
    <rect x="18" y="44" width="5" height="54" rx="2.5" class="warn"/>
    <text x="38" y="77" class="ink" font-size="22" font-weight="800">今日まで</text>
    <text x="247" y="77" class="ink" font-size="23" font-weight="800">0件</text>
    <text x="321" y="78" class="ink" font-size="22">∨</text>

    <line x1="20" y1="116" x2="354" y2="116" class="line"/>
    <text x="38" y="151" class="ink" font-size="21" font-weight="700">明日まで</text>
    <text x="247" y="151" class="ink" font-size="22" font-weight="700">0件</text>
    <text x="321" y="151" class="muted" font-size="22">∨</text>

    <line x1="20" y1="166" x2="354" y2="166" class="line"/>
    <text x="38" y="201" class="muted" font-size="21" font-weight="700">今週中</text>
    <text x="247" y="201" class="muted" font-size="22" font-weight="700">0件</text>
    <text x="321" y="201" class="muted" font-size="22">∨</text>
  </g>

  <g transform="translate(28 474)">
    <text x="0" y="0" class="ink" font-size="23" font-weight="800">メニュー</text>

    <rect x="0" y="25" width="374" height="76" rx="22" class="soft-card"/>
    <circle cx="38" cy="63" r="19" fill="#CFF6EE"/>
    <text x="38" y="70" text-anchor="middle" class="accent" font-size="21" font-weight="800">✓</text>
    <text x="72" y="69" class="ink" font-size="22" font-weight="800">課題通知</text>
    <text x="336" y="70" class="ink" font-size="25">›</text>

    <rect x="0" y="115" width="374" height="76" rx="22" class="white-card"/>
    <circle cx="38" cy="153" r="19" fill="#EAF1FF"/>
    <text x="38" y="160" text-anchor="middle" class="blue" font-size="20" font-weight="800">i</text>
    <text x="72" y="159" class="ink" font-size="22" font-weight="800">大学に関する通知</text>
    <text x="336" y="160" class="ink" font-size="25">›</text>

    <rect x="0" y="205" width="374" height="76" rx="22" class="white-card"/>
    <circle cx="38" cy="243" r="19" fill="#EAF8F5"/>
    <text x="38" y="250" text-anchor="middle" class="accent" font-size="19" font-weight="800">≡</text>
    <text x="72" y="249" class="ink" font-size="22" font-weight="800">大学情報まとめ</text>
    <text x="336" y="250" class="ink" font-size="25">›</text>

    <rect x="0" y="295" width="374" height="76" rx="22" class="white-card"/>
    <circle cx="38" cy="333" r="19" fill="#FFF1E8"/>
    <text x="38" y="340" text-anchor="middle" class="warn" font-size="19" font-weight="800">Q</text>
    <text x="72" y="339" class="ink" font-size="22" font-weight="800">過去問データベース</text>
    <text x="336" y="340" class="ink" font-size="25">›</text>
  </g>

  <rect x="28" y="876" width="374" height="36" rx="18" fill="#E7F6F3"/>
  <text x="215" y="899" text-anchor="middle" class="muted" font-size="13" font-weight="700">期限未検出の課題もここから確認</text>
</svg>
