<script>
  const AUTO_REFRESH_INTERVAL = 15 * 60 * 1000;
  const NOTIFIED_IDS_KEY = 'notifiedAssignmentMessageIds';
  const GROUP_OPEN_STATE_KEY = 'notificationGroupOpenState';
  const HELP_SEEN_KEY = 'assignmentHubHelpSeen';

  let lastUndoMessageId = '';
  let undoToastTimerId = null;
  const notificationData = {active: [], completed: []};
  const notificationRequestIds = {active: 0, completed: 0};
  const notificationStatusChanges = new Map();
  let notificationStatusGeneration = 0;
  let currentViewMode = 'active';
  let currentRawData = [];
  let homeRawData = [];
  let selectedCourseName = 'すべて';
  let currentScreen = 'home';
  let expandedHomeDueGroup = null;
  let groupOpenState = getGroupOpenState();
  let securityTokenVisible = false;

  updateBottomNavState();
  renderHome();
  loadHomeNotifications();
  showHelpOnFirstVisit();

  setInterval(() => {
    if (currentScreen === 'active' || currentScreen === 'home') {
      refreshNotifications();
    }
  }, AUTO_REFRESH_INTERVAL);

  function getErrorMessage(error) {
    return error && error.message ? error.message : String(error);
  }

  function loadHomeNotifications() {
    requestNotificationData('active', {
      method: 'refreshAndGetNotificationsForWeb', remember: true, homeSync: true
    });
  }

  function showHomeView() {
    currentScreen = 'home';
    currentViewMode = 'active';
    closeCourseFilterPanel();
    setAppView('home');
    refreshCurrentView();
  }

  function showAssignmentView(viewMode = 'active') {
    currentScreen = viewMode === 'completed' ? 'completed' : 'active';
    currentViewMode = currentScreen;
    setAppView('assignment');
    refreshCurrentView();
  }

  function setAppView(viewName) {
    document.getElementById('university-view').classList.toggle('is-active', viewName === 'university');
    const homeView = document.getElementById('home-view');
    const assignmentView = document.getElementById('assignment-view');

    if (homeView) {
      homeView.classList.toggle('is-active', viewName === 'home');
    }

    if (assignmentView) {
      assignmentView.classList.toggle('is-active', viewName === 'assignment');
    }
  }

  function updateHomeSyncText() {
    const syncText = document.getElementById('home-sync-text');

    if (!syncText) {
      return;
    }

    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    syncText.textContent = `同期済み ${hours}:${minutes}`;
  }

  function renderHome() {
    renderHomeDueCard();
  }

  function renderHomeDueCard() {
    const container = document.getElementById('home-due-card');

    if (!container) {
      return;
    }

    const activeData = homeRawData;
    const groups = groupNotificationsByDue(activeData);
    const homeGroups = [
      getHomeDueGroup(groups, 'today', '今日まで'),
      getHomeDueGroup(groups, 'tomorrow', '明日まで'),
      getHomeDueGroup(groups, 'thisWeek', '今週中')
    ];

    container.innerHTML = homeGroups.map(group => getHomeDueGroupHtml(group)).join('');
  }

  function getHomeDueGroup(groups, key, label) {
    const group = groups.find(item => item.key === key);

    return {
      key,
      label,
      items: group ? group.items : []
    };
  }

  function getHomeDueGroupHtml(group) {
    const count = group.items.length;
    const isExpanded = expandedHomeDueGroup === group.key && count > 0;
    const rowClasses = [
      'home-due-row',
      count === 0 ? 'is-empty' : '',
      group.key === 'today' && count > 0 ? 'is-urgent' : ''
    ].filter(Boolean).join(' ');
    const ariaExpanded = count > 0 ? String(isExpanded) : 'false';
    const onclick = count > 0 ? ` onclick="toggleHomeDueGroup('${group.key}')"` : '';
    const arrow = count > 0 ? (isExpanded ? '⌃' : '⌄') : '';

    return `
      <button class="${rowClasses}" type="button" aria-expanded="${ariaExpanded}"${onclick}>
        <span>${escapeHtml(group.label)}</span>
        <span class="home-due-count">${count}件</span>
        <span class="home-due-arrow">${arrow}</span>
      </button>
      <div class="home-due-items${isExpanded ? ' is-open' : ''}">
        ${getHomeDueItemsHtml(group.items)}
      </div>
    `;
  }

  function getHomeDueItemsHtml(items) {
    if (!items || items.length === 0) {
      return '';
    }

    const courseCounts = new Map();

    items.forEach(item => {
      const courseName = getCourseName(item);
      courseCounts.set(courseName, (courseCounts.get(courseName) || 0) + 1);
    });

    return Array.from(courseCounts.entries()).map(([courseName, count]) => {
      return `
        <div class="home-due-item">
          <span class="home-due-course">${escapeHtml(courseName)}</span>
          <span>${count}件</span>
        </div>
      `;
    }).join('');
  }

  function toggleHomeDueGroup(groupKey) {
    expandedHomeDueGroup = expandedHomeDueGroup === groupKey ? null : groupKey;
    renderHomeDueCard();
  }

  function openUnknownDueAssignments() {
    loadNotifications();
  }

  function showHelpOnFirstVisit() {
    if (localStorage.getItem(HELP_SEEN_KEY) === 'true') {
      return;
    }

    openHelpModal();
  }

  function openHelpModal() {
    const backdrop = document.getElementById('help-modal-backdrop');

    if (backdrop) {
      backdrop.classList.add('is-open');
    }
  }

  function closeHelpModal() {
    const backdrop = document.getElementById('help-modal-backdrop');

    if (backdrop) {
      backdrop.classList.remove('is-open');
    }

    localStorage.setItem(HELP_SEEN_KEY, 'true');
  }

  function openSecurityModal() {
    const backdrop = document.getElementById('security-modal-backdrop');

    if (backdrop) {
      backdrop.classList.add('is-open');
    }

    loadSecuritySettings();
  }

  function closeSecurityModal() {
    const backdrop = document.getElementById('security-modal-backdrop');
    const tokenInput = document.getElementById('security-api-token');
    const toggleButton = document.getElementById('security-token-toggle');
    const copyButton = document.getElementById('security-token-copy');

    if (backdrop) {
      backdrop.classList.remove('is-open');
    }

    if (tokenInput) {
      tokenInput.value = '';
      tokenInput.type = 'password';
      tokenInput.dataset.hasFullToken = 'false';
    }

    if (toggleButton) {
      toggleButton.disabled = true;
      toggleButton.textContent = '表示';
    }

    if (copyButton) {
      copyButton.disabled = true;
    }

    securityTokenVisible = false;
    setSecurityMessage('');
  }

  function loadSecuritySettings() {
    const tokenInput = document.getElementById('security-api-token');
    const toggleButton = document.getElementById('security-token-toggle');
    const copyButton = document.getElementById('security-token-copy');
    const status = document.getElementById('security-auth-status');

    if (tokenInput) {
      tokenInput.value = '読み込み中...';
      tokenInput.type = 'password';
      tokenInput.dataset.hasFullToken = 'false';
    }

    if (toggleButton) {
      toggleButton.disabled = true;
      toggleButton.textContent = '表示';
    }

    if (copyButton) {
      copyButton.disabled = true;
    }

    if (status) {
      status.textContent = '確認中';
    }

    setSecurityMessage('');

    google.script.run
      .withSuccessHandler(renderSecuritySettings)
      .withFailureHandler(error => {
        console.error(error);
        setSecurityMessage('読み込みに失敗しました：' + getErrorMessage(error), true);
      })
      .getSecuritySettingsForWeb();
  }

  function renderSecuritySettings(settings) {
    const tokenInput = document.getElementById('security-api-token');
    const toggleButton = document.getElementById('security-token-toggle');
    const copyButton = document.getElementById('security-token-copy');
    const status = document.getElementById('security-auth-status');
    const hasFullToken = Boolean(settings && settings.apiToken);
    const hasApiToken = Boolean(settings && settings.hasApiToken);

    securityTokenVisible = false;

    if (tokenInput) {
      tokenInput.value = hasFullToken
        ? settings.apiToken
        : hasApiToken
          ? settings.tokenPreview || '保存済み'
          : '未発行';
      tokenInput.type = hasFullToken ? 'password' : 'text';
      tokenInput.dataset.hasFullToken = hasFullToken ? 'true' : 'false';
    }

    if (toggleButton) {
      toggleButton.disabled = !hasFullToken;
      toggleButton.textContent = '表示';
    }

    if (copyButton) {
      copyButton.disabled = !hasFullToken;
    }

    if (status) {
      status.textContent = settings && settings.postAuthRequired ? '有効' : '未設定';
    }

    if (!hasFullToken && hasApiToken) {
      setSecurityMessage('保存済みトークンは安全のため表示しません。拡張機能へ再設定する場合は再発行してください。');
    } else if (!hasFullToken) {
      setSecurityMessage('APIトークンは未発行です。使い始めるには再発行してください。');
    }
  }

  function toggleSecurityTokenVisibility() {
    const tokenInput = document.getElementById('security-api-token');
    const toggleButton = document.getElementById('security-token-toggle');

    if (!tokenInput) {
      return;
    }

    if (tokenInput.dataset.hasFullToken !== 'true') {
      setSecurityMessage('トークン本体は再発行直後だけ表示できます。', true);
      return;
    }

    securityTokenVisible = !securityTokenVisible;
    tokenInput.type = securityTokenVisible ? 'text' : 'password';

    if (toggleButton) {
      toggleButton.textContent = securityTokenVisible ? '隠す' : '表示';
    }
  }

  function copySecurityToken() {
    const tokenInput = document.getElementById('security-api-token');

    if (!tokenInput || !tokenInput.value || tokenInput.value === '読み込み中...') {
      return;
    }

    if (tokenInput.dataset.hasFullToken !== 'true') {
      setSecurityMessage('保存済みトークンはコピーできません。再発行直後のトークンをコピーしてください。', true);
      return;
    }

    const shouldHideAfterCopy = !securityTokenVisible;

    tokenInput.type = 'text';
    tokenInput.select();
    tokenInput.setSelectionRange(0, tokenInput.value.length);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tokenInput.value)
        .then(() => {
          if (shouldHideAfterCopy) {
            tokenInput.type = 'password';
          }

          setSecurityMessage('コピーしました。');
        })
        .catch(() => copySecurityTokenFallback(tokenInput, shouldHideAfterCopy));
      return;
    }

    copySecurityTokenFallback(tokenInput, shouldHideAfterCopy);
  }

  function copySecurityTokenFallback(tokenInput, shouldHideAfterCopy) {
    try {
      document.execCommand('copy');
      setSecurityMessage('コピーしました。');
    } catch (e) {
      setSecurityMessage('コピーに失敗しました。手動で選択してください。', true);
    } finally {
      if (shouldHideAfterCopy) {
        tokenInput.type = 'password';
      }
    }
  }

  function rotateSecurityToken() {
    if (!confirm('APIトークンを再発行すると、古いトークンを使う拡張機能からのPOSTは失敗します。再発行しますか？')) {
      return;
    }

    setSecurityMessage('再発行中...');

    google.script.run
      .withSuccessHandler(settings => {
        renderSecuritySettings(settings);
        setSecurityMessage('トークンを再発行しました。この画面を閉じる前にコピーしてください。');
      })
      .withFailureHandler(error => {
        console.error(error);
        setSecurityMessage('再発行に失敗しました：' + getErrorMessage(error), true);
      })
      .rotateApiTokenForWeb();
  }

  function setSecurityMessage(message, isError) {
    const messageElement = document.getElementById('security-message');

    if (!messageElement) {
      return;
    }

    messageElement.textContent = message || '';
    messageElement.classList.toggle('is-error', Boolean(isError));
  }

  function requestNotificationData(viewMode, options = {}) {
    const requestId = ++notificationRequestIds[viewMode];
    const statusGeneration = notificationStatusGeneration;
    const list = document.getElementById('list');
    const syncText = document.getElementById('home-sync-text');
    const isCurrentRequest = () => requestId === notificationRequestIds[viewMode]
      && statusGeneration === notificationStatusGeneration;

    if (options.loadingText && currentScreen === viewMode) {
      list.textContent = options.loadingText;
    }
    if (options.homeSync && syncText) {
      syncText.textContent = '同期中...';
    }

    const runner = google.script.run
      .withSuccessHandler(data => {
        if (!isCurrentRequest()) return;
        setNotificationData(data, viewMode);
        if (options.remember) rememberExistingNotifications(data);
        if (options.notify) notifyNewNotifications(notificationData[viewMode]);
        if (viewMode === 'active') updateHomeSyncText();
      })
      .withFailureHandler(error => {
        if (!isCurrentRequest()) return;
        console.error(error);
        if (options.loadingText && currentScreen === viewMode) {
          list.textContent = 'エラーが発生しました：' + getErrorMessage(error);
        }
        if (viewMode === 'active' && syncText) syncText.textContent = '同期失敗';
      });
    const method = options.method || (viewMode === 'completed'
      ? 'getCompletedNotificationsForWeb' : 'getNotificationsForWeb');
    runner[method]();
  }

  function rebuildNotifications() {
    requestNotificationData('active', {
      method: 'rebuildAndGetNotificationsForWeb',
      loadingText: '通知一覧を再構築中...', remember: true
    });
  }

  function loadNotifications() {
    closeCourseFilterPanel();
    showAssignmentView('active');
    requestNotificationData('active', {loadingText: '読み込み中...', remember: true});
  }

  function loadCompletedNotifications() {
    closeCourseFilterPanel();
    showAssignmentView('completed');
    requestNotificationData('completed', {loadingText: '完了済み一覧を読み込み中...'});
  }

  function refreshNotifications() {
    requestNotificationData('active', {method: 'refreshAndGetNotificationsForWeb', notify: true});
  }

  function requestBrowserNotificationPermission() {
    if (!('Notification' in window)) {
      alert('このブラウザは通知に対応していません。');
      return;
    }

    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        alert('ブラウザ通知を許可しました。');
      } else {
        alert('ブラウザ通知が許可されませんでした。');
      }
    });
  }

  function manualRefreshNotifications() {
    if (currentScreen === 'completed') {
      requestNotificationData('completed', {loadingText: '完了済み一覧を更新中...'});
      return;
    }

    requestNotificationData('active', {
      method: 'refreshAndGetNotificationsForWeb', loadingText: '更新中...', notify: true
    });
  }

  function notifyNewNotifications(data) {
    if (!('Notification' in window)) {
      return;
    }

    if (Notification.permission !== 'granted') {
      return;
    }

    const notifiedIds = getNotifiedIds();
    const notifications = Array.isArray(data) ? data : [];

    const newNotifications = notifications.filter(item => {
      const messageId = String(item.messageId || '');

      return isNotifiableNotification(item)
        && messageId
        && !notifiedIds.has(messageId);
    });

    newNotifications.forEach(item => {
      const messageId = String(item.messageId || '');

      new Notification('新しい課題通知', {
        body: `${item.courseName || '授業名未抽出'}\n${item.title || 'タイトル未抽出'}\n期限：${item.dueDate || '未検出'}`
      });

      notifiedIds.add(messageId);
    });

    saveNotifiedIds(notifiedIds);
  }

  function rememberExistingNotifications(data) {
    const notifiedIds = getNotifiedIds();
    const notifications = Array.isArray(data) ? data : [];

    notifications.forEach(item => {
      const messageId = String(item.messageId || '');

      if (isNotifiableNotification(item) && messageId) {
        notifiedIds.add(messageId);
      }
    });

    saveNotifiedIds(notifiedIds);
  }

  function isNotifiableNotification(item) {
    if (!item || !item.messageId || item.status === '完了') {
      return false;
    }

    return item.source === 'Google Classroom' || item.source === 'inCampus';
  }

  function getNotifiedIds() {
    const saved = localStorage.getItem(NOTIFIED_IDS_KEY);

    if (!saved) {
      return new Set();
    }

    try {
      return new Set(JSON.parse(saved));
    } catch (e) {
      return new Set();
    }
  }

  function saveNotifiedIds(ids) {
    const array = Array.from(ids).slice(-500);
    localStorage.setItem(NOTIFIED_IDS_KEY, JSON.stringify(array));
  }

  function refreshCurrentView() {
    homeRawData = notificationData.active;
    if (currentScreen === 'home') {
      currentViewMode = 'active';
      currentRawData = notificationData.active;
      renderHome();
    } else if (currentScreen === 'active' || currentScreen === 'completed') {
      currentViewMode = currentScreen;
      currentRawData = notificationData[currentScreen];
      if (!hasCourseName(currentRawData, selectedCourseName)) selectedCourseName = 'すべて';
      renderCourseFilterList();
      renderFilteredNotifications();
      updateActiveFilterBar();
    }

    updateBottomNavState();
  }

  function setNotificationData(data, viewMode = 'active') {
    notificationData[viewMode] = Array.isArray(data) ? data.slice() : [];
    // Reads may finish while a status change is still in flight. Preserve the
    // latest local intent until the serialized writes finish and we read again.
    notificationStatusChanges.forEach((change, messageId) => {
      applyNotificationStatusToCache(messageId, change.desiredDone, change.item);
    });
    homeRawData = notificationData.active;
    if (currentScreen === viewMode || (viewMode === 'active' && currentScreen === 'home')) {
      refreshCurrentView();
    }
  }

  function hasCourseName(data, courseName) {
    if (courseName === 'すべて') {
      return true;
    }

    return data.some(item => getCourseName(item) === courseName);
  }

  function getCourseName(item) {
    const name = String(item && item.courseName ? item.courseName : '授業名未抽出').trim();

    return name || '授業名未抽出';
  }

  function getCourseCounts(data) {
    const counts = new Map();

    data.forEach(item => {
      const courseName = getCourseName(item);
      counts.set(courseName, (counts.get(courseName) || 0) + 1);
    });

    return counts;
  }

  function renderCourseFilterList() {
    const container = document.getElementById('course-filter-list');

    if (!container) {
      return;
    }

    const counts = getCourseCounts(currentRawData);
    const courseNames = Array.from(counts.keys()).sort((a, b) => a.localeCompare(b, 'ja'));
    const totalCount = currentRawData.length;

    const buttons = [
      {
        name: 'すべて',
        count: totalCount
      },
      ...courseNames.map(name => ({
        name,
        count: counts.get(name) || 0
      }))
    ];

    container.innerHTML = '';

    buttons.forEach(item => {
      const button = document.createElement('button');
      const name = document.createElement('span');
      const count = document.createElement('span');

      button.type = 'button';
      button.className = 'course-filter-chip';
      button.classList.toggle('active', item.name === selectedCourseName);
      button.addEventListener('click', () => selectCourseFilter(item.name));

      name.className = 'course-filter-name';
      name.textContent = item.name;

      count.className = 'course-filter-count';
      count.textContent = `${item.count}件`;

      button.appendChild(name);
      button.appendChild(count);
      container.appendChild(button);
    });
  }

  function selectCourseFilter(courseName) {
    selectedCourseName = String(courseName || 'すべて');

    refreshCurrentView();
    closeCourseFilterPanel();
  }

  function getFilteredNotificationsByCourse() {
    if (selectedCourseName === 'すべて') {
      return currentRawData;
    }

    return currentRawData.filter(item => getCourseName(item) === selectedCourseName);
  }

  function renderFilteredNotifications() {
    const filteredData = getFilteredNotificationsByCourse();
    renderNotifications(filteredData, currentViewMode);
  }

  function toggleCourseFilterPanel() {
    const panel = document.getElementById('course-filter-panel');
    const backdrop = document.getElementById('course-filter-backdrop');

    if (!panel || !backdrop) {
      return;
    }

    const isOpen = panel.classList.contains('is-open');

    if (isOpen) {
      closeCourseFilterPanel();
    } else {
      renderCourseFilterList();
      panel.classList.add('is-open');
      backdrop.classList.add('is-open');
    }
  }

  function closeCourseFilterPanel() {
    const panel = document.getElementById('course-filter-panel');
    const backdrop = document.getElementById('course-filter-backdrop');

    if (panel) {
      panel.classList.remove('is-open');
    }

    if (backdrop) {
      backdrop.classList.remove('is-open');
    }
  }

  function updateBottomNavState() {
    const homeButton = document.getElementById('bottom-home-button');
    const activeButton = document.getElementById('bottom-active-button');
    const completedButton = document.getElementById('bottom-completed-button');
    const courseButton = document.getElementById('bottom-course-button');

    if (currentScreen === 'home') {
      setBottomNavButton(homeButton, '課題通知', loadNotifications, false, false);
      setBottomNavButton(activeButton, '大学からのお知らせ', showUniversityNotices, false, false);
      setBottomNavButton(completedButton, '大学情報まとめ', null, false, true);
      setBottomNavButton(courseButton, '過去問データベース', null, false, true);
      return;
    }

    if (currentScreen === 'university') {
      setBottomNavButton(homeButton, 'ホーム', showHomeView, false, false);
      setBottomNavButton(activeButton, '大学からのお知らせ', showUniversityNotices, true, false);
      setBottomNavButton(completedButton, '課題通知', loadNotifications, false, false);
      setBottomNavButton(courseButton, '大学情報まとめ', null, false, true);
      return;
    }
    setBottomNavButton(homeButton, 'ホーム', showHomeView, false, false);
    setBottomNavButton(activeButton, '未完了', loadNotifications, currentScreen === 'active', false);
    setBottomNavButton(completedButton, '完了済み', loadCompletedNotifications, currentScreen === 'completed', false);
    setBottomNavButton(courseButton, 'フィルター', toggleCourseFilterPanel, selectedCourseName !== 'すべて', false);
  }

  function setBottomNavButton(button, label, handler, isActive, isDisabled) {
    if (!button) {
      return;
    }

    button.textContent = label;
    button.disabled = Boolean(isDisabled);
    button.classList.toggle('active', Boolean(isActive));
    button.onclick = isDisabled || !handler ? null : handler;
  }

  function getGroupOpenState() {
    const saved = localStorage.getItem(GROUP_OPEN_STATE_KEY);

    if (!saved) {
      return {};
    }

    try {
      const parsed = JSON.parse(saved);

      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
        return parsed;
      }

      return {};
    } catch (e) {
      return {};
    }
  }

function saveGroupOpenState() {
  localStorage.setItem(GROUP_OPEN_STATE_KEY, JSON.stringify(groupOpenState));
}

function getGroupStateKey(viewMode, groupKey) {
  return `${viewMode}:${groupKey}`;
}

function getDefaultGroupOpen(viewMode, groupKey) {
  if (viewMode === 'completed') {
    return false;
  }

  // 未完了一覧では、期限なし・期限未検出だけ初期状態で閉じる
  // ここが一番スクロールを食いやすいので、最初から畳む
  return groupKey !== 'none' && groupKey !== 'unknown';
}

function isGroupOpen(viewMode, groupKey) {
  const stateKey = getGroupStateKey(viewMode, groupKey);

  if (Object.prototype.hasOwnProperty.call(groupOpenState, stateKey)) {
    return Boolean(groupOpenState[stateKey]);
  }

  return getDefaultGroupOpen(viewMode, groupKey);
}

function toggleGroup(viewMode, groupKey) {
  const stateKey = getGroupStateKey(viewMode, groupKey);
  const nextOpen = !isGroupOpen(viewMode, groupKey);

  groupOpenState[stateKey] = nextOpen;
  saveGroupOpenState();

  const groupBody = document.getElementById(`group-body-${viewMode}-${groupKey}`);
  const groupButton = document.getElementById(`group-button-${viewMode}-${groupKey}`);
  const groupArrow = document.getElementById(`group-arrow-${viewMode}-${groupKey}`);

  if (groupBody) {
    groupBody.style.display = nextOpen ? '' : 'none';
  }

  if (groupButton) {
    groupButton.setAttribute('aria-expanded', String(nextOpen));
    groupButton.className = nextOpen ? 'group-title is-open' : 'group-title is-closed';
  }

  if (groupArrow) {
    groupArrow.textContent = nextOpen ? '⌃' : '⌄';
  }
}

  function renderNotifications(data, viewMode = 'active') {
  const list = document.getElementById('list');

  if (!data || data.length === 0) {
    list.textContent = viewMode === 'completed'
      ? '完了済みの通知はまだありません。'
      : '通知はまだありません。';
    return;
  }

  list.innerHTML = '';

  const groups = groupNotificationsByDue(data, viewMode);
  let cardIndex = 0;
  let renderedCount = 0;

  groups.forEach(group => {
    if (group.items.length === 0) {
      return;
    }

    const groupOpen = isGroupOpen(viewMode, group.key);
    const groupButtonId = `group-button-${viewMode}-${group.key}`;
    const groupBodyId = `group-body-${viewMode}-${group.key}`;
    const groupArrowId = `group-arrow-${viewMode}-${group.key}`;

    const groupTitle = document.createElement('button');
    groupTitle.type = 'button';
    groupTitle.id = groupButtonId;
    groupTitle.className = groupOpen ? 'group-title is-open' : 'group-title is-closed';
    groupTitle.setAttribute('aria-expanded', String(groupOpen));
    groupTitle.setAttribute('aria-controls', groupBodyId);
    groupTitle.onclick = () => toggleGroup(viewMode, group.key);

    groupTitle.innerHTML = `
      <span class="group-label">${escapeHtml(group.label)}</span>
      <span class="group-meta">
        <span class="group-count">${group.items.length}件</span>
        <span class="group-arrow" id="${groupArrowId}">${groupOpen ? '⌃' : '⌄'}</span>
      </span>
    `;

    list.appendChild(groupTitle);

    const groupBody = document.createElement('div');
    groupBody.id = groupBodyId;
    groupBody.className = 'group-body';
    groupBody.style.display = groupOpen ? '' : 'none';

    group.items.forEach(item => {
      const card = document.createElement('div');
      card.className = `card ${getCardClassByGroupKey(group.key)}`;

      const currentIndex = cardIndex;

      card.innerHTML = `
        <div class="source">${escapeHtml(item.source || '')}</div>
        <div class="course">${escapeHtml(item.courseName || '授業名未抽出')}</div>
        <div class="title">${escapeHtml(item.title || 'タイトル未抽出')}</div>
        <div class="due">期限：${escapeHtml(item.dueDate || '未検出')}</div>
        <div class="status">状態：${escapeHtml(getDisplayDueStatus(item.dueStatus))} / ${escapeHtml(getDisplayStatus(item.status))}</div>
        <div class="status">メール受信：${escapeHtml(item.receivedAt || '')}</div>
        ${item.supplementKey ? '<div class="status">inCampusの課題詳細で補足済み</div>' : ''}

        <div class="button-row">
          ${getClassroomOpenButtonHtml(item)}
          <button onclick="toggleBody(${currentIndex})">詳細</button>
          ${getStatusActionButtonHtml(item, viewMode)}
        </div>

        <div class="body" id="body-${currentIndex}">${escapeHtml(item.body || '')}</div>
      `;

      groupBody.appendChild(card);
      cardIndex++;
      renderedCount++;
    });

    list.appendChild(groupBody);
  });

  if (renderedCount === 0) {
    list.textContent = '表示対象の通知はありません。';
  }
}

  function getClassroomOpenButtonHtml(item) {
    const url = item && item.classroomUrl ? String(item.classroomUrl).trim() : '';

    if (!isSafeHttpUrl(url)) {
      return '';
    }

    return `<a class="button classroom-button" href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">課題を開く</a>`;
  }

  function isSafeHttpUrl(url) {
    try {
      const parsedUrl = new URL(String(url || ''), window.location.href);
      return parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:';
    } catch (e) {
      return false;
    }
  }

  function getDisplayDueStatus(dueStatus) {
    if (dueStatus === '抽出成功') {
      return '期限抽出成功';
    }

    return dueStatus || '';
  }

  function getDisplayStatus(status) {
    if (status === '未確認') {
      return '未完了';
    }

    return status || '';
  }

  function getStatusActionButtonHtml(item, viewMode) {
    const encodedMessageId = encodeURIComponent(item.messageId || '');

    if (!encodedMessageId) {
      return '';
    }

    if (viewMode === 'completed') {
      return `<button onclick="markAsUndone('${encodedMessageId}')">未完了に戻す</button>`;
    }

    return `<button onclick="markAsDone('${encodedMessageId}')">完了</button>`;
  }

  function groupNotificationsByDue(data, viewMode = 'active') {
    if (viewMode === 'completed') {
      return [
        {
          key: 'completed',
          label: '完了済み',
          items: data.slice().sort((a, b) => {
            const completedDiff = (b.completedAtTime || 0) - (a.completedAtTime || 0);

            if (completedDiff !== 0) {
              return completedDiff;
            }

            return (b.receivedAtTime || 0) - (a.receivedAtTime || 0);
          })
        }
      ];
    }

    const groupMap = {
      expired: {
        key: 'expired',
        label: '期限切れ',
        items: []
      },
      today: {
        key: 'today',
        label: '今日まで',
        items: []
      },
      tomorrow: {
        key: 'tomorrow',
        label: '明日まで',
        items: []
      },
      thisWeek: {
        key: 'thisWeek',
        label: '今週中',
        items: []
      },
      later: {
        key: 'later',
        label: '来週以降',
        items: []
      },
      none: {
        key: 'none',
        label: '期限なし',
        items: []
      },
      unknown: {
        key: 'unknown',
        label: '期限未検出',
        items: []
      }
    };

    data.forEach(item => {
      const key = getDueGroupKey(item);

      if (groupMap[key]) {
        groupMap[key].items.push(item);
      } else {
        groupMap.unknown.items.push(item);
      }
    });

    Object.values(groupMap).forEach(group => {
      group.items.sort((a, b) => getDueSortValue(a) - getDueSortValue(b));
    });

    return [
      groupMap.expired,
      groupMap.today,
      groupMap.tomorrow,
      groupMap.thisWeek,
      groupMap.later,
      groupMap.none,
      groupMap.unknown
    ];
  }

  function getDueGroupKey(item) {
    if (item.dueType === 'none') {
      return 'none';
    }

    if (item.dueType === 'unknown' || !item.dueDateKey) {
      return 'unknown';
    }

    const dueDate = parseDateKey(item.dueDateKey);

    if (!dueDate) {
      return 'unknown';
    }

    const deadline = getDeadlineDateTime(item);

    if (!deadline) {
      return 'unknown';
    }

    const now = new Date();

    if (deadline < now) {
      return 'expired';
    }

    const today = getStartOfToday();
    const tomorrow = addDays(today, 1);
    const endOfWeek = getEndOfThisWeek(today);

    if (isSameDate(dueDate, today)) {
      return 'today';
    }

    if (isSameDate(dueDate, tomorrow)) {
      return 'tomorrow';
    }

    if (dueDate <= endOfWeek) {
      return 'thisWeek';
    }

    return 'later';
  }

  function getDeadlineDateTime(item) {
    const date = parseDateKey(item.dueDateKey);

    if (!date) {
      return null;
    }

    let hour = 23;
    let minute = 59;

    if (item.dueTime) {
      const parts = String(item.dueTime).split(':');

      if (parts.length === 2) {
        const parsedHour = Number(parts[0]);
        const parsedMinute = Number(parts[1]);

        if (
          Number.isInteger(parsedHour) &&
          Number.isInteger(parsedMinute) &&
          parsedHour >= 0 &&
          parsedHour <= 23 &&
          parsedMinute >= 0 &&
          parsedMinute <= 59
        ) {
          hour = parsedHour;
          minute = parsedMinute;
        }
      }
    }

    date.setHours(hour, minute, 0, 0);

    return date;
  }

  function getDueSortValue(item) {
    const deadline = getDeadlineDateTime(item);

    if (deadline) {
      return deadline.getTime();
    }

    if (item.dueType === 'none') {
      return Number.MAX_SAFE_INTEGER - 1;
    }

    return Number.MAX_SAFE_INTEGER;
  }

  function parseDateKey(dateKey) {
    const match = String(dateKey || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if (!match) {
      return null;
    }

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);

    const date = new Date(year, month - 1, day);

    if (
      date.getFullYear() !== year ||
      date.getMonth() !== month - 1 ||
      date.getDate() !== day
    ) {
      return null;
    }

    return date;
  }

  function getStartOfToday() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return today;
  }

  function addDays(date, days) {
    const result = new Date(date);
    result.setDate(result.getDate() + days);
    return result;
  }

  function getEndOfThisWeek(today) {
    const result = new Date(today);
    const day = result.getDay();
    const daysUntilSunday = (7 - day) % 7;

    result.setDate(result.getDate() + daysUntilSunday);
    result.setHours(23, 59, 59, 999);

    return result;
  }

  function isSameDate(a, b) {
    return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
  }

  function getCardClassByGroupKey(key) {
    if (key === 'expired') {
      return 'is-expired';
    }

    if (key === 'today') {
      return 'is-urgent';
    }

    if (key === 'tomorrow') {
      return 'is-soon';
    }

    if (key === 'thisWeek' || key === 'later') {
      return 'is-later';
    }

    if (key === 'completed') {
      return 'is-completed';
    }

    if (key === 'none') {
      return 'is-none';
    }

    if (key === 'unknown') {
      return 'is-unknown';
    }

    return '';
  }

  function toggleBody(index) {
    const body = document.getElementById(`body-${index}`);

    if (!body) {
      return;
    }

    if (body.style.display === 'block') {
      body.style.display = 'none';
    } else {
      body.style.display = 'block';
    }
  }

  function markAsDone(encodedMessageId) {
    const messageId = decodeURIComponent(encodedMessageId || '');
    if (!messageId) return;
    requestNotificationStatus(messageId, true, '完了状態の更新に失敗しました：');
    showUndoToast(messageId);
  }

  function applyNotificationStatusToCache(messageId, done, fallbackItem) {
    const matches = item => String(item.messageId || '') === messageId;
    const item = notificationData.active.find(matches)
      || notificationData.completed.find(matches) || fallbackItem;
    notificationData.active = notificationData.active.filter(item => !matches(item));
    notificationData.completed = notificationData.completed.filter(item => !matches(item));
    if (item) {
      notificationData[done ? 'completed' : 'active'].push({
        ...item, status: done ? '完了' : '未確認',
        completedAtTime: done ? (item.completedAtTime || Date.now()) : 0
      });
    }
  }

  function requestNotificationStatus(messageId, done, failureMessage) {
    let change = notificationStatusChanges.get(messageId);
    if (!change) {
      const item = notificationData.active.concat(notificationData.completed)
        .find(item => String(item.messageId || '') === messageId);
      change = {item, confirmedDone: Boolean(item && item.status === '完了'), version: 0, inFlight: false};
      notificationStatusChanges.set(messageId, change);
    }
    change.desiredDone = done;
    change.failureMessage = failureMessage;
    change.version++;
    notificationStatusGeneration++;
    applyNotificationStatusToCache(messageId, done, change.item);
    refreshCurrentView();
    if (!change.inFlight) sendNotificationStatus(messageId, change);
  }

  function sendNotificationStatus(messageId, change) {
    const done = change.desiredDone;
    const version = change.version;
    change.inFlight = true;
    const runner = google.script.run
      .withSuccessHandler(() => {
        change.inFlight = false;
        change.confirmedDone = done;
        notificationStatusGeneration++;
        if (change.desiredDone !== done) {
          sendNotificationStatus(messageId, change);
        } else {
          finishNotificationStatus(messageId);
        }
      })
      .withFailureHandler(error => {
        change.inFlight = false;
        notificationStatusGeneration++;
        console.error(error);
        // A newer click takes precedence even if the previous RPC failed. Send
        // it explicitly, since a transport failure can follow a server write.
        if (change.version !== version) {
          sendNotificationStatus(messageId, change);
          return;
        }
        applyNotificationStatusToCache(messageId, change.confirmedDone, change.item);
        if (lastUndoMessageId === messageId) hideUndoToast();
        alert(change.failureMessage + getErrorMessage(error));
        finishNotificationStatus(messageId);
      });
    runner[done ? 'markNotificationDone' : 'markNotificationUndone'](messageId);
  }

  function finishNotificationStatus(messageId) {
    notificationStatusChanges.delete(messageId);
    refreshCurrentView();
    if (notificationStatusChanges.size === 0) {
      // Mutation responses contain whole-list snapshots which may predate a
      // different task's update. Read both caches after all pending writes.
      requestNotificationData('active');
      requestNotificationData('completed');
    }
  }

  function showUndoToast(messageId) {
    lastUndoMessageId = String(messageId || '');

    const toast = document.getElementById('undo-toast');

    if (!toast || !lastUndoMessageId) {
      return;
    }

    if (undoToastTimerId) {
      clearTimeout(undoToastTimerId);
    }

    toast.classList.add('is-visible');

    undoToastTimerId = setTimeout(() => {
      hideUndoToast();
    }, 6000);
  }

  function hideUndoToast() {
    const toast = document.getElementById('undo-toast');

    if (toast) {
      toast.classList.remove('is-visible');
    }

    if (undoToastTimerId) {
      clearTimeout(undoToastTimerId);
      undoToastTimerId = null;
    }

    lastUndoMessageId = '';
  }

  function undoLastDone() {
    const messageId = lastUndoMessageId;

    if (!messageId) {
      return;
    }

    hideUndoToast();
    requestNotificationStatus(messageId, false, '取消に失敗しました：');
  }

  function markAsUndone(encodedMessageId) {
    const messageId = decodeURIComponent(encodedMessageId || '');

    if (!messageId) {
      return;
    }

    requestNotificationStatus(messageId, false, '未完了への戻しに失敗しました：');
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttribute(text) {
    return escapeHtml(text);
  }

  function updateActiveFilterBar() {
    const bar = document.getElementById('active-filter-bar');
    const text = document.getElementById('active-filter-text');

    if (!bar || !text) {
      return;
    }

    if (selectedCourseName === 'すべて') {
      bar.classList.remove('is-visible');
      text.textContent = '';
      return;
    }

    text.textContent = `フィルター：${selectedCourseName}`;
    bar.classList.add('is-visible');
  }

  function clearCourseFilter() {
    selectedCourseName = 'すべて';

    refreshCurrentView();
  }

</script>
