  .course-filter-backdrop {

.course-filter-header {

}

.course-filter-name {

.course-filter-count {

}

@media (min-width: 720px) {

}

.undo-toast {
  position: fixed;
  right: 16px;
  bottom: calc(144px + env(safe-area-inset-bottom));
  z-index: 1200;
  display: none;
  align-items: center;
  gap: 18px;
  max-width: min(420px, calc(100% - 32px));
  background: #1f2937;
  color: white;
  padding: 12px 14px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.22);
  font-size: 14px;
}

.sync-toast {
  position: fixed;
  right: 16px;
  bottom: calc(76px + env(safe-area-inset-bottom));
  z-index: 1201;
  display: none;
  align-items: center;
  max-width: min(420px, calc(100% - 32px));

  color: #fff;

}

.sync-toast.is-visible {
  display: flex;
}

.sync-toast.is-error {
  background: #991b1b;
}

.sync-toast.is-loading::before {
  content: '';
  flex: 0 0 14px;
  width: 14px;
  height: 14px;
  margin-right: 10px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;

}

@keyframes sync-toast-spin {
  to { transform: rotate(360deg); }
}

.sync-toast-message {
  flex: 1;
}

.undo-toast.is-visible {
  display: flex;
}

.undo-toast-message {
  flex: 1;
}

.undo-toast-button {

}

.settings-section {

.security-token-row {

}

.security-token-input {
  min-width: 0;

  padding: 8px 10px;
  font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.security-hint {
  margin-top: 10px;
  color: #555;

}

.test-mode-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.test-mode-row strong {
  color: #26352d;
}

.test-mode-switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 52px;
  width: 52px;
  height: 30px;
}

.test-mode-switch input {
  width: 1px;
  height: 1px;
  opacity: 0;
  position: absolute;
}

.test-mode-slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  border-radius: 999px;
  background: #9ca3af;
  transition: background-color .16s ease;
}

.test-mode-slider::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .16s ease;
}

.test-mode-switch input:checked + .test-mode-slider {
  background: #16804b;
}

.test-mode-switch input:checked + .test-mode-slider::before {
  transform: translateX(22px);
}

.test-mode-switch input:focus-visible + .test-mode-slider {
  outline: 3px solid #86efac;
  outline-offset: 2px;
}

.test-mode-switch input:disabled + .test-mode-slider {
  cursor: not-allowed;
  opacity: .55;
}

.security-danger-button {
  margin-top: 16px;

/* Home */
.app-view {
  display: none;
}

.app-view.is-active {
  display: block;
}

.home-view {
  min-height: 100vh;
  background: #f8fbfb;
  color: #102027;
  padding-bottom: 104px;
}

.home-hero {
  padding: 32px 24px 28px;
  background: linear-gradient(135deg, #d5fff5 0%, #dff0ff 100%);
}

.home-hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
}

.home-title {
  margin: 0;
  font-size: 34px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: 0;
}

.home-subtitle {
  margin: 14px 0 0;
  color: #6b7b83;
  font-size: 15px;
  font-weight: 800;
}

.home-actions {
  display: flex;
  gap: 12px;
}

.home-icon-button {
  width: 58px;
  height: 58px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.78);
  color: #102027;
  font-size: 30px;
  font-weight: 800;
  cursor: pointer;
}

.home-icon-button svg {
  width: 34px;
  height: 34px;
}

.home-sync-pill {
  margin-top: 34px;
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.88);
  color: #102027;
  font-size: 15px;
  font-weight: 900;
}

.home-sync-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #14b8a6;
}

.home-content {
  padding: 28px 24px 0;
}

.home-section-title {
  margin: 0 0 22px;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 900;
}

.home-due-card {
  background: white;
  border: 1px solid #d9e7e8;
  border-radius: 26px;
  padding: 20px 24px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
}

.home-due-row {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 32px;
  align-items: center;
  gap: 16px;
  min-height: 56px;
  border: none;
  border-bottom: 1px solid #dbe7e8;
  background: transparent;
  color: #102027;
  padding: 8px 0;
  border-radius: 0;
  text-align: left;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
}

.home-due-row:last-child {
  border-bottom: none;
}

.home-due-row.is-empty {
  cursor: default;
  color: #7a8a91;
}

.home-due-row.is-empty .home-due-arrow {
  visibility: hidden;
}

.home-due-row.is-urgent {
  position: relative;
  background: #fff3ec;
  border-bottom: none;
  border-radius: 16px;
  padding: 8px 22px;
  margin-bottom: 8px;
}

.home-due-row.is-urgent::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 5px;
  border-radius: 999px;
  background: #ff8a65;
}

.home-due-count {
  min-width: 54px;
  text-align: right;
}

.home-due-arrow {
  text-align: right;
  font-size: 24px;
  color: #102027;
}

.home-due-items {
  display: none;
  padding-left: 22px;
}

.home-due-items.is-open {
  display: block;
}

.home-due-item {
  display: grid;
