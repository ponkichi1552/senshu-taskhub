<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>課題Hub Classroom API検証</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202124; background: #f5f7fb; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: 0 auto; background: #fff; border: 1px solid #dfe3eb; border-radius: 16px; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p { line-height: 1.6; }
    .note { padding: 12px 14px; background: #eef4ff; border-radius: 10px; }
    button { border: 0; border-radius: 9px; background: #3157c8; color: #fff; padding: 11px 16px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 16px; font-weight: 600; }
    #summary { margin: 12px 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; vertical-align: top; border-bottom: 1px solid #e6e8ee; padding: 9px; }
    th { background: #f7f8fa; white-space: nowrap; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; color: #9b1c1c; }
    .muted { color: #5f6368; font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <h1>Classroom API 読取テスト</h1>
    <p class="note">「Classroom APIを読み取る」は読み取り専用で、保存Excelを変更しません。「APIのみ保存同期」はAPI課題をログイン中の利用者の個人用保存Excelへ保存します。どちらもGmailにはアクセスしません。</p>
    <p class="muted">提出本文・回答・提出ファイルは取得しません。期限時刻はAPIのUTC値を日本時間に変換し、APIに時刻がない期限は23:59にします。実際の公開日時はAPIがscheduledTimeを返す場合のみ記録します。</p>
    <button id="run" type="button">Classroom APIを読み取る</button>
    <button id="sync" type="button">APIのみ保存同期（Gmailなし）</button>
    <button id="download" type="button" hidden>取得データをJSONでダウンロード</button>
    <div id="status" role="status" aria-live="polite">未実行</div>
    <div id="summary"></div>
    <pre id="error"></pre>
    <div class="table-wrap">
      <table>
        <thead><tr><th>授業</th><th>課題</th><th>期限（日本時間）</th><th>提出状態 / TaskHub判定</th><th>確認情報</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script>
    const button = document.getElementById('run');
    const status = document.getElementById('status');
    const summary = document.getElementById('summary');
    const error = document.getElementById('error');
    const rows = document.getElementById('rows');
    const download = document.getElementById('download');
    let lastResult = null;

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value || '—';
      row.appendChild(cell);
    }

    function render(result) {
      button.disabled = false;
      syncButton.disabled = false;
      rows.replaceChildren();
      error.textContent = '';
      download.hidden = true;
      lastResult = null;
      if (!result || !result.ok) {
        status.textContent = 'API読み取りに失敗しました';
        error.textContent = result && result.message ? result.message : '応答を解釈できませんでした。';
        summary.textContent = '';
        return;
      }

      status.textContent = '読み取り成功（読み取り専用・保存なし）';
      summary.textContent = `授業 ${result.courseCount} 件 / 公開済み課題 ${result.courseworkCount} 件 / 本人の提出状況 ${result.submissionCount} 件 / ${result.elapsedMs} ms`;
      lastResult = result;
      download.hidden = false;
      result.coursework.forEach(item => {
        const row = document.createElement('tr');
        addCell(row, item.courseName);
        addCell(row, item.title);
        addCell(row, item.dueDate ? `${item.dueDate} ${item.dueTime}` : '期限なし');
        const submission = result.submissions.find(entry => entry.courseId === item.courseId && entry.courseworkId === item.id);
        addCell(row, submission ? submission.state : '提出記録なし');
        addCell(row, item.updateTime);
        rows.appendChild(row);
      });
      if (result.errors && result.errors.length) {
        error.textContent = result.errors.map(item => `${item.courseName}${item.courseworkTitle ? ` / ${item.courseworkTitle}` : ''} (${item.section}): ${item.message}`).join('\n');
      }
    }

    download.addEventListener('click', () => {
      if (!lastResult) return;
      const blob = new Blob([JSON.stringify(lastResult, null, 2)], {type: 'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `classroom-api-export-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    button.addEventListener('click', () => {
      syncButton.disabled = true;
      button.disabled = true;
      status.textContent = 'Classroom APIから読み取り中...';
      summary.textContent = '';
      error.textContent = '';
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(reason => render({ok:false, message:String(reason && reason.message || reason)}))
        .getClassroomApiExperimentWorkbookDataForWeb();
    });

    const syncButton = document.getElementById('sync');
    syncButton.addEventListener('click', () => {
      button.disabled = true;
      syncButton.disabled = true;
      download.hidden = true;
      status.textContent = 'Classroom APIのみで保存Excelを更新中...';
      summary.textContent = '';
      error.textContent = '';
      rows.replaceChildren();
      google.script.run
        .withSuccessHandler(response => {
          button.disabled = false;
          syncButton.disabled = false;
          if (!response || !response.ok) {
            status.textContent = 'API同期に失敗しました';
            error.textContent = response && response.message ? response.message : '応答を解釈できませんでした。';
            return;
          }
          const result = response.result;
          status.textContent = response.gmailCalled ? '予期しないGmail呼び出しを検出しました' : 'API同期成功（Gmail呼び出しなし）';
          summary.textContent = `授業 ${result.courseCount} 件 / 保存課題 ${result.courseworkCount} 件 / API提出済み ${result.submittedCourseworkCount} 件 / 保存状態「完了」 ${result.completedCourseworkCount} 件`;
          result.courseworkStatuses.forEach(item => {
            const row = document.createElement('tr');
            addCell(row, item.courseName);
            addCell(row, item.title);
            addCell(row, item.due);
            addCell(row, `${item.submissionState || '状態なし'} / ${item.status}`);
            addCell(row, '保存済み');
            rows.appendChild(row);
          });
        })
        .withFailureHandler(reason => {
          button.disabled = false;
          syncButton.disabled = false;
          status.textContent = 'API同期に失敗しました';
          error.textContent = String(reason && reason.message || reason);
        })
        .syncClassroomApiOnlyForExperimentWeb();
    });
  </script>
</body>
</html>
