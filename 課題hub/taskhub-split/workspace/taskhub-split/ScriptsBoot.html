<script>
  groupOpenState = getGroupOpenState();

  updateBottomNavState();
  renderHome();
  loadTestCaseClockState();
  showHelpOnFirstVisit();

  function loadInitialTaskHubView(location) {
    const view = location && location.parameter && location.parameter.view;
    if (view === 'university') {
      showUniversityNotices();
    } else if (view === 'assignment') {
      loadNotifications();
    } else {
      loadHomeNotifications();
    }
  }

  if (google.script.url && typeof google.script.url.getLocation === 'function') {
    google.script.url.getLocation(loadInitialTaskHubView);
  } else {
    loadHomeNotifications();
  }

  setInterval(() => {
    if (currentScreen === 'active' || currentScreen === 'home') {
      refreshNotifications();
    }
  }, AUTO_REFRESH_INTERVAL);
</script>
